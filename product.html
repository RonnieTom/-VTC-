<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="青禾超市商品詳情">
  <title>青禾超市｜商品詳情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">青</span>
        <span class="brand-text">
          <strong>青禾超市</strong>
          <span>新鮮 · 日常 · 精選</span>
        </span>
      </a>
      <a class="cart-link" href="cart.html">購物車 (<span id="cart-count">0</span>)</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="site-nav" aria-expanded="false">選單</button>
    </div>
  </header>

  <nav class="site-nav" id="site-nav" aria-label="主要導覽">
    <div class="nav-inner">
      <a href="index.html">首頁</a>
      <a href="products.html" class="active">商品</a>
      <a href="about.html">關於</a>
      <a href="contact.html">聯絡</a>
      <a href="cart.html">購物車</a>
    </div>
  </nav>

  <main>
    <div class="main-inner">
      <p class="breadcrumb">
        <a href="products.html">商品</a>
        <span aria-hidden="true"> / </span>
        <span id="pd-crumb">詳情</span>
      </p>

      <section id="product-missing" class="panel" hidden>
        <h1>找不到商品</h1>
        <p><a class="btn" href="products.html">返回商品列表</a></p>
      </section>

      <section id="product-detail" class="product-detail" aria-live="polite">
        <!-- 左側：圖片區，之後可於此掛載 3D 模型 -->
        <div class="product-media panel">
          <div
            id="product-media-stage"
            class="product-media-stage"
            data-view="image"
            data-model=""
            data-product-id=""
          >
            <img id="pd-image" src="" alt="" width="640" height="480">
            <!-- 未來 3D：在此插入 canvas / model-viewer，並將 data-view 改為 model -->
          </div>
          <!-- 之後接上 3D 時再顯示切換：圖片 / 3D -->
          <div class="media-tools is-pending" aria-hidden="true"></div>
        </div>

        <!-- 右側：資訊與選購 -->
        <div class="product-info panel">
          <p class="pd-category" id="pd-category"></p>
          <h1 id="pd-name">商品</h1>
          <p class="pd-unit small" id="pd-unit"></p>
          <p class="pd-price" id="pd-price"></p>
          <p id="pd-desc"></p>
          <ul id="pd-points" class="pd-points"></ul>

          <div class="pd-buy" id="order-form">
            <div class="form-row">
              <label for="customer-name">姓名</label>
              <input type="text" id="customer-name" name="customer-name" maxlength="40" placeholder="您的姓名" autocomplete="name">
            </div>
            <div class="form-row">
              <label for="product-qty">數量</label>
              <div class="qty-control">
                <button type="button" id="qty-minus" aria-label="減少">−</button>
                <input type="number" id="product-qty" name="qty" min="1" max="99" value="1" inputmode="numeric">
                <button type="button" id="qty-plus" aria-label="增加">+</button>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn" id="btn-calc">計算小計</button>
              <button type="button" class="btn btn-accent" id="btn-add">加入購物車</button>
            </div>
            <div id="order-msg" class="msg" hidden></div>
            <div class="summary-box" id="order-preview"></div>
            <p class="form-actions" style="margin-top:12px;">
              <a class="btn btn-secondary" href="cart.html">查看購物車</a>
              <a class="btn btn-secondary" href="products.html">返回列表</a>
            </p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner footer-grid">
      <div>
        <h3>青禾超市</h3>
        <p>新鮮食材與日常雜貨，陪你把每一餐準備得更好。</p>
      </div>
      <div>
        <h3>逛逛</h3>
        <ul>
          <li><a href="index.html">首頁</a></li>
          <li><a href="products.html">商品</a></li>
          <li><a href="contact.html">聯絡</a></li>
        </ul>
      </div>
      <div>
        <h3>服務</h3>
        <ul>
          <li>週一至日 08:00–22:00</li>
          <li>hello@qinghe-market.example</li>
        </ul>
      </div>
    </div>
    <div class="footer-inner credits">© 青禾超市</div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
