<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="青禾超市購物車">
  <title>青禾超市｜購物車</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">青</span>
        <span class="brand-text">
          <strong>青禾超市</strong>
          <span>新鮮 · 日常 · 精選</span>
        </span>
      </a>
      <a class="cart-link" href="cart.html">購物車 (<span id="cart-count">0</span>)</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="site-nav" aria-expanded="false">選單</button>
    </div>
  </header>

  <nav class="site-nav" id="site-nav" aria-label="主要導覽">
    <div class="nav-inner">
      <a href="index.html">首頁</a>
      <a href="products.html">商品</a>
      <a href="about.html">關於</a>
      <a href="contact.html">聯絡</a>
      <a href="cart.html" class="active">購物車</a>
    </div>
  </nav>

  <main>
    <div class="main-inner">
      <section class="panel">
        <div class="panel-title">
          <h1>購物車</h1>
        </div>
        <div id="cart-msg" class="msg" hidden></div>
        <p id="cart-empty" class="small" hidden>購物車是空的。<a href="products.html">去選購</a></p>
      </section>

      <section class="panel" id="cart-table-wrap" hidden>
        <table class="data">
          <thead>
            <tr>
              <th>商品</th>
              <th>單價</th>
              <th>數量</th>
              <th>小計</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
        </table>

        <div class="summary-box" id="cart-summary" aria-live="polite"></div>

        <div class="form-actions" style="margin-top:14px;">
          <button type="button" class="btn btn-accent" id="btn-checkout">確認結算</button>
          <button type="button" class="btn btn-secondary" id="btn-clear">清空</button>
          <a class="btn btn-secondary" href="products.html">繼續購物</a>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>運費</h2>
        </div>
        <table class="data">
          <thead>
            <tr>
              <th>條件</th>
              <th>運費</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>小計未滿 HK$200</td>
              <td class="num">HK$ 20.00</td>
            </tr>
            <tr>
              <td>小計滿 HK$200</td>
              <td class="num">免運費</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner footer-grid">
      <div>
        <h3>青禾超市</h3>
        <p>新鮮食材與日常雜貨，陪你把每一餐準備得更好。</p>
      </div>
      <div>
        <h3>逛逛</h3>
        <ul>
          <li><a href="index.html">首頁</a></li>
          <li><a href="products.html">商品</a></li>
          <li><a href="contact.html">聯絡</a></li>
        </ul>
      </div>
      <div>
        <h3>服務</h3>
        <ul>
          <li>週一至日 08:00–22:00</li>
          <li>hello@qinghe-market.example</li>
        </ul>
      </div>
    </div>
    <div class="footer-inner credits">© 青禾超市</div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
