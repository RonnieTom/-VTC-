<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="聯絡青禾超市">
  <title>青禾超市｜聯絡</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">青</span>
        <span class="brand-text">
          <strong>青禾超市</strong>
          <span>新鮮 · 日常 · 精選</span>
        </span>
      </a>
      <a class="cart-link" href="cart.html">購物車 (<span id="cart-count">0</span>)</a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="site-nav" aria-expanded="false">選單</button>
    </div>
  </header>

  <nav class="site-nav" id="site-nav" aria-label="主要導覽">
    <div class="nav-inner">
      <a href="index.html">首頁</a>
      <a href="products.html">商品</a>
      <a href="about.html">關於</a>
      <a href="contact.html" class="active">聯絡</a>
      <a href="cart.html">購物車</a>
    </div>
  </nav>

  <main>
    <div class="main-inner">
      <section class="panel">
        <div class="panel-title">
          <h1>聯絡我們</h1>
        </div>
        <p>訂單、配送或商品問題，歡迎留言，我們會盡快回覆。</p>
      </section>

      <section class="grid-2">
        <article class="panel" style="margin:0;">
          <h2>留言</h2>
          <form id="contact-form" action="#" method="get" novalidate>
            <div class="form-row">
              <label for="c-name">姓名</label>
              <input type="text" id="c-name" name="name" required maxlength="40" placeholder="您的姓名">
            </div>
            <div class="form-row">
              <label for="c-email">電郵</label>
              <input type="email" id="c-email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-row">
              <label for="c-topic">主題</label>
              <select id="c-topic" name="topic">
                <option value="order">訂單</option>
                <option value="product">商品</option>
                <option value="delivery">配送</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div class="form-row">
              <label for="c-message">內容</label>
              <textarea id="c-message" name="message" required maxlength="500" placeholder="請寫下您的問題"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-accent">送出</button>
              <button type="reset" class="btn btn-secondary">清空</button>
            </div>
            <div id="contact-msg" class="msg" hidden></div>
          </form>
        </article>

        <aside class="panel" style="margin:0;">
          <h2>門市資料</h2>
          <table class="data">
            <thead>
              <tr>
                <th>項目</th>
                <th>資料</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>電郵</td><td>hello@qinghe-market.example</td></tr>
              <tr><td>電話</td><td>2345 6789</td></tr>
              <tr><td>時間</td><td>每日 08:00–22:00</td></tr>
              <tr><td>地址</td><td>青禾道 18 號地下</td></tr>
            </tbody>
          </table>
          <figure class="figure">
            <img src="images/store.svg" width="640" height="360" alt="青禾超市門市">
            <figcaption>門市位置示意</figcaption>
          </figure>
        </aside>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner footer-grid">
      <div>
        <h3>青禾超市</h3>
        <p>新鮮食材與日常雜貨，陪你把每一餐準備得更好。</p>
      </div>
      <div>
        <h3>逛逛</h3>
        <ul>
          <li><a href="index.html">首頁</a></li>
          <li><a href="products.html">商品</a></li>
          <li><a href="about.html">關於</a></li>
        </ul>
      </div>
      <div>
        <h3>服務</h3>
        <ul>
          <li>週一至日 08:00–22:00</li>
          <li>hello@qinghe-market.example</li>
        </ul>
      </div>
    </div>
    <div class="footer-inner credits">© 青禾超市</div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      "use strict";
      var form = document.getElementById("contact-form");
      var msg = document.getElementById("contact-msg");
      if (!form) return;

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("c-name").value.replace(/^\s+|\s+$/g, "");
        var email = document.getElementById("c-email").value.replace(/^\s+|\s+$/g, "");
        var message = document.getElementById("c-message").value.replace(/^\s+|\s+$/g, "");
        var topic = document.getElementById("c-topic").value;

        if (!name || !email || !message) {
          msg.className = "msg err";
          msg.textContent = "請填寫姓名、電郵與內容。";
          msg.hidden = false;
          return;
        }
        if (email.indexOf("@") < 1) {
          msg.className = "msg err";
          msg.textContent = "電郵格式不正確。";
          msg.hidden = false;
          return;
        }

        var labels = { order: "訂單", product: "商品", delivery: "配送", other: "其他" };
        msg.className = "msg ok";
        msg.textContent = name + "，已收到您的「" + (labels[topic] || topic) + "」訊息，我們會回覆 " + email + "。";
        msg.hidden = false;
        form.reset();
      });
    })();
  </script>
</body>
</html>
